  je_prestige_good_specialty_sugar_tt: "[SCOPE.sCompany('relevant_company').GetName] will be able to produce @prestige_good_specialty_sugar! #b $prestige_good_specialty_sugar$#!"
  not_prestige_good_specialty_sugar_var_tt: "Has #b not#! already developed @prestige_good_specialty_sugar! #b $prestige_good_specialty_sugar$#!"
