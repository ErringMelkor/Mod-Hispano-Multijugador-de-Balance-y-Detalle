--Specialty Sugar (event)
  je_prestige_good_specialty_sugar: "$prestige_good_specialty_sugar$"
  je_prestige_good_specialty_sugar_reason: "[SCOPE.sCompany('relevant_company').GetName] has established itself as an important actor within our economy. The company seeks to leverage its current prosperity to develop its own brand of @prestige_good_specialty_sugar! #b $prestige_good_specialty_sugar$#!. If successful, it will be able to expand its competitiveness within the global @sugar! #b $sugar$#! market."
  je_prestige_good_specialty_sugar_goal: "Maintain the following for #v [GetPlayer.MakeScope.ScriptValue('prestige_good_journal_entry_months')] months#! (currently #v [ROOT.GetCountry.MakeScope.Var('prestige_good_specialty_sugar_var').GetValue]#!): #indent_newline:3 "
